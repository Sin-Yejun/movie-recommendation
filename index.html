<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filmio - 영화 추천 플랫폼</title>
    <meta name="description" content="최신 상영작과 실관람객 리뷰를 바탕으로 AI 큐레이터에게 영화를 묻고 추천받는 곳." />
    <link rel="stylesheet" href="style.css" />
    <!-- 폰트: Pretendard(한글) & Google Fonts(Sofia Sans Extra Condensed, Barlow) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@200;400&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- 아이콘: FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/12.2.0/markdown-it.min.js"></script>
    <script>
      // 대화 기록: 서버는 대화를 저장하지 않으므로 매 요청에 함께 보냄 (서버가 최근 턴만 잘라서 사용)
      const chatHistory = [];

      function scrollToBottom() {
        const chatWindow = document.querySelector(".chat-window");
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }

      async function sendMessage() {
        const url = "https://movie-recommendation-server-ajob4uxiyq-du.a.run.app/chat";
        const input = document.getElementById("message");
        const message = input.value.trim();
        const thread = document.getElementById("response");

        if (!message) return;

        // 버튼 비활성화 (중복 클릭 방지)
        const submitButton = document.getElementById("submit-button");
        submitButton.disabled = true;
        submitButton.style.opacity = "0.5";
        submitButton.style.cursor = "not-allowed";

        // 첫 질문이면 안내 문구 제거 후, 질문 말풍선 + 답변 영역 + 추천 카드 영역을 대화 끝에 추가
        thread.querySelector(".empty-state")?.remove();
        const userBubble = document.createElement("div");
        userBubble.className = "user-msg";
        userBubble.textContent = message;
        const responseContainer = document.createElement("div");
        responseContainer.className = "ai-msg";
        responseContainer.innerHTML = `<p class="pending"><i class="fas fa-spinner fa-spin" aria-hidden="true"></i> AI가 답변을 생성하고 있습니다…</p>`;
        const recContainer = document.createElement("div");
        thread.append(userBubble, responseContainer, recContainer);
        input.value = "";
        scrollToBottom();

        const md = window.markdownit();

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ input: message, history: chatHistory }),
            });

            // 일일 한도 초과(429) 등은 서버가 안내 문구를 본문으로 보냄
            if (!response.ok) throw new Error((await response.text()) || "Network response was not ok");

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = "";
            let answerPart = "";
            let recJsonStr = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                fullText += chunk;

                // 추천 데이터 구분자 확인 (<<<REC>>>)
                const splitParts = fullText.split("<<<REC>>>");

                // 1. 답변 부분 (Markdown 렌더링)
                answerPart = splitParts[0];
                responseContainer.innerHTML = md.render(answerPart);

                // 2. 추천 데이터 부분 (아직 전송 중일 수 있음)
                if (splitParts.length > 1) {
                    recJsonStr = splitParts[1];
                }
                scrollToBottom();
            }

            // 스트리밍 완료 후 추천 카드 처리
            if (recJsonStr.trim()) {
                try {
                    const recommendations = JSON.parse(recJsonStr.trim());
                    renderRecommendationCards(recommendations, recContainer);
                    scrollToBottom();
                } catch (e) {
                    console.error("추천 데이터 파싱 실패:", e);
                }
            }

            // 성공한 턴만 기록 (추천 JSON은 화면 표시용이므로 제외)
            chatHistory.push({ role: "user", content: message }, { role: "assistant", content: answerPart });

        } catch (error) {
            responseContainer.classList.add("is-error");
            responseContainer.innerText = "오류가 발생했습니다: " + error.message;
        } finally {
            // 버튼 재활성화
            submitButton.disabled = false;
            submitButton.style.opacity = "1";
            submitButton.style.cursor = "pointer";
        }
    }

    // 추천 카드 렌더링 함수 분리 (각 답변 아래에 표시)
    function renderRecommendationCards(titles, recContainer) {

        const recTitle = document.createElement("h3");
        recTitle.className = "rec-title";
        recTitle.innerText = "추천 영화 바로보기";
        recContainer.appendChild(recTitle);

        const cardWrapper = document.createElement("div");
        cardWrapper.className = "rec-wrapper";
        recContainer.appendChild(cardWrapper);


        titles.forEach(title => {
             // 영화 제목으로 정보 찾기 (allMovies 배열 활용)
             const movieInfo = allMovies.find(m => m.제목.includes(title)) || { 제목: title, 영화포스터: null };
             const poster = movieInfo.영화포스터 || "https://via.placeholder.com/150x220?text=No+Image";
             const rating = movieInfo["관람객 평점"] || "N/A";
             const audience = movieInfo["관객수"] || "";

             const card = document.createElement("button");
             card.type = "button";
             card.className = "rec-card";
             card.innerHTML = `
                <span class="poster-wrapper"><img src="${poster}" alt="" width="150" height="225"></span>
                <span class="card-info">
                    <span class="rec-name">${movieInfo.제목}</span>
                    <span class="rating"><i class="fas fa-star" aria-hidden="true"></i> ${rating}</span>
                    <span class="audience">${audience}</span>
                </span>
             `;
             card.onclick = () => {
                 const input = document.getElementById("message");
                 input.value = `영화 "${movieInfo.제목}" 상세 정보 알려줘`;
                 input.focus();
             };
             cardWrapper.appendChild(card);
        });
    }

      async function loadMovies() {
        try {
          const response = await fetch("src/db/movies.json");
          const movies = await response.json();

          const gallery = document.querySelector(".image-gallery");
          gallery.innerHTML = "";

          movies.forEach((movie, index) => {
            const movieItem = document.createElement("div");
            movieItem.classList.add("image-item");
            if (index >= 4) movieItem.style.display = "none";

            movieItem.innerHTML = `
                        <img src="${movie.영화포스터}" alt="${movie.제목}" onclick="setMovieQuery('${movie.제목}')">
                        <p>${movie.제목}</p>
                    `;
            gallery.appendChild(movieItem);
          });
          showSlides(0);
        } catch (error) {
          console.error("Error loading movies:", error);
        }
      }

      function setMovieQuery(title) {
        document.getElementById(
          "message"
        ).value = `${title} 영화에 대한 정보 알려줘.`;
      }

      let currentIndex = 0;
      function showSlides(index) {
        const slides = document.querySelectorAll(".image-item");
        const totalSlides = slides.length;
        const itemsToShow = 4;

        if (index >= totalSlides) {
          currentIndex = 0;
        } else if (index < 0) {
          currentIndex = totalSlides - itemsToShow;
        } else {
          currentIndex = index;
        }

        slides.forEach((slide, i) => {
          slide.style.display =
            i >= currentIndex && i < currentIndex + itemsToShow
              ? "block"
              : "none";
        });
      }

      function nextSlides() {
        showSlides(currentIndex + 4);
      }

      function prevSlides() {
        showSlides(currentIndex - 4);
      }

      // date.txt 파일을 불러와 표시하는 함수
      async function loadDate() {
        try {
          const response = await fetch("src/db/date.txt");
          if (!response.ok) {
            throw new Error("date.txt 파일을 불러오지 못했습니다.");
          }
          const dateText = await response.text();
          document.getElementById("date-display").textContent = dateText;
        } catch (error) {
          console.error("Error loading date:", error);
          document.getElementById("date-display").textContent =
            "업데이트 날짜를 불러올 수 없습니다.";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadMovies();
        loadDate();
      });

      let loadingInterval;

      function startLoadingAnimation() {
        const loadingText = document.getElementById("loading-text");
        let dotCount = 0;
        loadingText.textContent = "답변 생성 중";

        loadingInterval = setInterval(() => {
          dotCount = (dotCount + 1) % 4; // 0~3까지 반복
          let dots = ".".repeat(dotCount);
          loadingText.textContent = "답변 생성 중" + dots;
        }, 500); // 0.5초마다 갱신
      }

      function stopLoadingAnimation() {
        clearInterval(loadingInterval);
        const loadingText = document.getElementById("loading-text");
        if (loadingText) {
          loadingText.textContent = "";
        }
      }
    </script>
  </head>

  <body>
    <header>
      <div class="brand">
        <h1>Filmio</h1>
        <div id="date-display">날짜 로드 중…</div>
      </div>
      <div class="cinema-links">
        <a href="https://cgv.co.kr/" target="_blank"
          ><img src="src/img/cgv_logo.png" alt="CGV" width="40" height="40"
        /></a>
        <a href="https://www.lottecinema.co.kr/NLCHS?referrer=https://www.google.com/" target="_blank"
          ><img src="src/img/lotte_logo.png" alt="롯데시네마" width="40" height="40"
        /></a>
        <a href="https://www.megabox.co.kr/" target="_blank"
          ><img src="src/img/megabox_logo.png" alt="메가박스" width="40" height="40"
        /></a>
      </div>
    </header>

    <div class="main-layout">
        <!-- 포스터 목록: 화면에서는 채팅 오른쪽(모바일은 아래)에 놓임 -->
        <aside class="side-panel">
            <section class="info-container">
                <h2>요즘 뜨는 영화</h2>
                <p class="subtitle">
                    AI가 최신 <strong><span id="stat-movies">0</span>편</strong>의 영화와
                    <strong><span id="stat-reviews">0</span>개</strong>의 실관람객 리뷰를 분석해드립니다.
                </p>
            </section>

            <section class="slider-container" aria-label="요즘 뜨는 영화 포스터">
                <div class="slider-content">
                    <div class="image-gallery" id="image-gallery">
                        <p class="gallery-status">로딩 중…</p>
                    </div>
                </div>
                <!-- ... -->

    <script>
        // ... (sendMessage function) ...

        let allMovies = [];

        // 영화 데이터 로드 및 그리드 렌더링
        async function loadMovies() {
            try {
                const response = await fetch("src/db/movies.json");
                if (!response.ok) throw new Error("Failed to load movies.json");
                
                allMovies = await response.json();
                renderMovies(allMovies);
            } catch (error) {
                console.error("영화 로딩 실패:", error);
                document.getElementById("image-gallery").innerHTML = "영화 정보를 불러올 수 없습니다.";
            }
        }

        function renderMovies(movies) {
            const gallery = document.getElementById("image-gallery");
            gallery.innerHTML = "";

            movies.forEach((movie) => {
                // 이미지가 없으면 기본값 처리 (필요시)
                const posterUrl = movie.영화포스터 || "https://via.placeholder.com/200x300?text=No+Image";

                const div = document.createElement("button");
                div.type = "button";
                div.className = "image-item";
                div.onclick = () => {
                    const input = document.getElementById("message");
                    input.value = `영화 "${movie.제목}"의 줄거리와 관람평 알려줘`;
                    input.focus();
                };

                div.innerHTML = `
                    <span class="poster"><img src="${posterUrl}" alt="" width="200" height="300" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'"/></span>
                    <span class="image-title">${movie.제목}</span>
                `;
                gallery.appendChild(div);
            });
        }
        
        // 초기 로드
        loadMovies();
        // ... (fetchStats logic) ...
    </script>
        </aside>

        <!-- 채팅: 화면의 주 작업 영역 -->
        <main class="chat-panel">
            <div class="chat-header">
                <h2>AI 영화 큐레이터</h2>
                <p>무엇이든 물어보세요. 줄거리, 리뷰, 배우 정보까지 알려드려요.</p>
            </div>

            <div class="chat-window">
                 <div class="response-container">
                    <div id="response" aria-live="polite">
                        <div class="empty-state">
                            <i class="fas fa-film" aria-hidden="true"></i>
                            <p>궁금한 영화나 장르를 물어보세요!<br>"반전 있는 스릴러 추천해줘"</p>
                        </div>
                    </div>
                </div>
            </div>

            <form onsubmit="event.preventDefault(); sendMessage();" class="input-area">
                <input
                    type="text"
                    id="message"
                    name="message"
                    aria-label="영화에 대해 질문하기"
                    placeholder="ex. 이 영화 평점 어때? / 가족이랑 볼만한 영화 추천"
                    required
                    autocomplete="off"
                />
                <button type="submit" id="submit-button" aria-label="보내기"><i class="fas fa-paper-plane" aria-hidden="true"></i></button>
            </form>
        </main>
    </div>

    <!-- Script Logic Updates -->
    <script>
        // 통계 데이터 가져오기 (API Call)
        async function fetchStats() {
            try {
                const url = "https://movie-recommendation-server-ajob4uxiyq-du.a.run.app/stats";
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById("stat-movies").innerText = data.movie_count.toLocaleString();
                    document.getElementById("stat-reviews").innerText = data.review_count.toLocaleString();
                }
            } catch (error) {
                console.error("통계 로드 실패:", error);
            }
        }
        fetchStats();
    </script>
  </body>
</html>
